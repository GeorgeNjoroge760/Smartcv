<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fd79a8"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="250" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1100" cy="530" r="300" fill="rgba(255,255,255,0.04)"/>
  <circle cx="600" cy="315" r="200" fill="rgba(255,255,255,0.02)"/>

  <!-- Brain Icon -->
  <g transform="translate(600,200)" fill="rgba(255,255,255,0.12)">
    <path d="M0,-80 C40,-80 70,-50 70,-10 C70,20 55,40 40,50 L40,70 C40,78 34,84 26,84 L-26,84 C-34,84 -40,78 -40,70 L-40,50 C-55,40 -70,20 -70,-10 C-70,-50 -40,-80 0,-80Z"/>
    <path d="M-25,-70 C-55,-50 -65,-10 -50,20 C-45,30 -35,35 -25,30 L-25,-70Z" fill="rgba(255,255,255,0.08)"/>
    <path d="M25,-70 C55,-50 65,-10 50,20 C45,30 35,35 25,30 L25,-70Z" fill="rgba(255,255,255,0.08)"/>
    <path d="M-15,-55 C-15,-25 -30,0 -50,15 C-40,22 -28,24 -18,18 C-8,12 0,-5 -5,-25Z" fill="rgba(255,255,255,0.06)"/>
    <path d="M15,-55 C15,-25 30,0 50,15 C40,22 28,24 18,18 C8,12 0,-5 5,-25Z" fill="rgba(255,255,255,0.06)"/>
  </g>

  <!-- Title -->
  <text x="600" y="370" text-anchor="middle" font-family="'Segoe UI',-apple-system,sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    SmartCV AI
  </text>

  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="'Segoe UI',-apple-system,sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)" letter-spacing="0.5">
    Professional CV &amp; Cover Letter Generator
  </text>

  <!-- Accent line -->
  <rect x="510" y="440" width="180" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>

  <!-- URL -->
  <text x="600" y="520" text-anchor="middle" font-family="'Segoe UI',-apple-system,sans-serif" font-size="18" font-weight="300" fill="rgba(255,255,255,0.5)" letter-spacing="2">
    smartcv-generator.vercel.app
  </text>
